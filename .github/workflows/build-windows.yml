name: Build Windows EXE on: push: branches: [ main ] workflow_dispatch: jobs: build: runs-on: windows-latest steps: - uses: actions/checkout@v4 - name: Install Rust uses: actions-rs/toolchain@v1 with: toolchain: stable - name: Build Release run: cargo build --release - name: Upload EXE to Release uses: softprops/action-gh-release@v1 with: files: target/release/cyber-shell-ui.exe env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
